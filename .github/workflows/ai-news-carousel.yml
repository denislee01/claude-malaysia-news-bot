name: Malaysia AI News Carousel

on:
  schedule:
    - cron: '0 0 * * *'    # 8:00am MYT (UTC+8)  — Morning post
    - cron: '30 10 * * *'  # 6:30pm MYT           — Evening post
  workflow_dispatch:         # Manual trigger from GitHub UI

permissions:
  contents: write            # Allows committing posted_urls.json back to repo

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run pipeline
        run: python pipeline.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Commit posted_urls.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_urls.json
          git diff --staged --quiet || git commit -m "chore: update posted_urls [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload slide artifacts (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides-${{ github.run_id }}
          path: ~/Downloads/carousels/
          retention-days: 7

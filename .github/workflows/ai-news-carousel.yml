name: Malaysia AI News Carousel

on:
  schedule:
    - cron: '0 0 * * *'    # 8:00am MYT  — Morning post (primary)
    - cron: '0 1 * * *'    # 9:00am MYT  — Morning retry 1
    - cron: '0 2 * * *'    # 10:00am MYT — Morning retry 2
    - cron: '30 10 * * *'  # 6:30pm MYT  — Evening post (primary)
    - cron: '30 11 * * *'  # 7:30pm MYT  — Evening retry 1
    - cron: '30 12 * * *'  # 8:30pm MYT  — Evening retry 2
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build slides and save artifacts but skip Instagram post'
        type: boolean
        default: false

permissions:
  contents: write            # Allows committing posted_urls.json back to repo

concurrency:
  group: instagram-post      # Only one run at a time — prevents double-posts from concurrent retries
  cancel-in-progress: false  # Queue, don't cancel — retries should still run

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run pipeline
        run: python pipeline.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Commit posted_urls.json
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_urls.json
          git diff --staged --quiet || git commit -m "chore: update posted_urls [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 10s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

      - name: Upload slide artifacts (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides-${{ github.run_id }}
          path: ~/Downloads/carousels/
          retention-days: 7
